<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Awaaz — Admin Studio</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f4f1eb;
      --surface: #fffdf9;
      --surface-2: #f8f5ef;
      --ink: #161616;
      --muted: #746e66;
      --line: rgba(22,22,22,.12);
      --green: #dcebd9;
      --peach: #f2d3bf;
      --orange: #c87948;
      --danger: #b44c3f;

      --sans: "Manrope", Arial, sans-serif;
      --dev: "Noto Sans Devanagari", sans-serif;
      --mono: "DM Mono", monospace;

      --radius: 20px;
      --shadow: 0 18px 50px rgba(30,25,20,.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    /* =========================
       HEADER
    ========================== */

    .admin-nav {
      height: 82px;
      padding: 0 5vw;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(244,241,235,.94);
      border-bottom: 1px solid var(--line);

      position: sticky;
      top: 0;
      z-index: 50;

      backdrop-filter: blur(14px);
    }

    .admin-brand {
      text-decoration: none;

      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .admin-brand-mark {
      font-family: var(--dev);
      font-size: 31px;
      line-height: 1;
      font-weight: 800;
    }

    .website-link {
      text-decoration: none;

      padding: 11px 16px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: var(--surface);

      font: 10px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;

      transition: .25s ease;
    }

    .website-link:hover {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    /* =========================
       MAIN
    ========================== */

    .admin-shell {
      width: min(1380px, 90vw);
      margin: 0 auto;
      padding: 54px 0 90px;
    }

    .eyebrow {
      display: block;

      font: 10px var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;

      color: var(--muted);
    }

    .admin-shell h1,
    .admin-shell h2,
    .admin-shell p {
      margin-top: 0;
    }

    /* =========================
       LOGIN
    ========================== */

    .login-card {
      width: min(560px, 100%);
      margin: 8vh auto;

      padding: 42px;

      background: var(--surface);

      border: 1px solid var(--line);
      border-radius: 28px;

      box-shadow: var(--shadow);
    }

    .login-card h1 {
      margin: 12px 0;

      font-family: var(--dev);
      font-size: clamp(48px, 6vw, 72px);
      line-height: .95;
      letter-spacing: -.05em;
    }

    .login-card > p {
      color: var(--muted);
      font-family: var(--dev);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .login-card input {
      width: 100%;
      margin-top: 12px;
    }

    .role-note {
      margin-top: 16px;
      padding: 14px 16px;

      border-radius: 14px;
      background: var(--surface-2);

      color: var(--muted);

      font-family: var(--dev);
      font-size: 13px;
      line-height: 1.7;
    }

    #loginMsg {
      display: block;
      margin-top: 14px;
      color: var(--danger);
      line-height: 1.6;
    }

    /* =========================
       INPUTS
    ========================== */

    input,
    select,
    textarea {
      width: 100%;

      border: 1px solid var(--line);
      border-radius: 12px;

      background: #fff;

      color: var(--ink);

      padding: 13px 14px;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(22,22,22,.42);

      box-shadow:
        0 0 0 4px rgba(22,22,22,.05);
    }

    textarea {
      resize: vertical;
      min-height: 220px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 18px;

      font: 10px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;

      color: var(--muted);
    }

    label input,
    label select,
    label textarea {
      margin-top: 8px;

      font-family: var(--sans);
      font-size: 14px;

      text-transform: none;
      letter-spacing: 0;
    }

    label small {
      display: block;
      margin-top: 8px;

      font-family: var(--dev);
      font-size: 12px;
      line-height: 1.6;

      color: var(--muted);

      text-transform: none;
      letter-spacing: 0;
    }

    /* =========================
       BUTTONS
    ========================== */

    .primary,
    .ghost {
      min-height: 46px;

      border-radius: 999px;
      padding: 0 20px;

      font: 10px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;

      transition:
        transform .2s ease,
        background .2s ease,
        color .2s ease;
    }

    .primary {
      width: 100%;

      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
    }

    .primary:hover {
      transform: translateY(-1px);
      background: #292929;
    }

    .ghost {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
    }

    .ghost:hover {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .login-card .ghost {
      width: 100%;
      margin-top: 10px;
    }

    /* =========================
       DASHBOARD HEADER
    ========================== */

    .dash-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;

      padding-bottom: 30px;

      border-bottom: 1px solid var(--ink);
    }

    .dash-head h1 {
      margin: 10px 0 7px;

      font-family: var(--dev);
      font-size: clamp(56px, 7vw, 92px);
      line-height: .9;
      letter-spacing: -.06em;
    }

    .dash-head small {
      color: var(--muted);
    }

    .role-badge {
      display: inline-flex;
      align-items: center;

      margin-left: 10px;
      padding: 5px 9px;

      border-radius: 999px;

      background: var(--green);

      font: 9px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* =========================
       STATS
    ========================== */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 14px;

      margin: 24px 0 30px;
    }

    .stats > div {
      min-height: 150px;

      padding: 22px;

      border: 1px solid var(--line);
      border-radius: 20px;

      background: var(--surface);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stats b {
      font-size: 54px;
      line-height: 1;
      letter-spacing: -.06em;
    }

    .stats span {
      font: 10px var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;

      color: var(--muted);
    }

    .stats > div:nth-child(2) {
      background: var(--green);
    }

    .stats > div:nth-child(3) {
      background: #f7e9df;
    }

    /* =========================
       EDITOR
    ========================== */

    .editor-card,
    .posts-admin {
      background: var(--surface);

      border: 1px solid var(--line);
      border-radius: 26px;

      box-shadow: var(--shadow);
    }

    .editor-card {
      padding: 32px;
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 25px;

      padding-bottom: 18px;

      border-bottom: 1px solid var(--line);
    }

    .editor-top h2 {
      margin: 0;

      font-family: var(--dev);
      font-size: 38px;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .editor-card form {
      display: grid;
      gap: 2px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .progress-line {
      min-height: 22px;
      margin: 4px 0 12px;

      color: var(--muted);

      font: 10px var(--mono);
      letter-spacing: .05em;
    }

    /* =========================
       POSTS
    ========================== */

    .posts-admin {
      margin-top: 30px;
      padding: 32px;
    }

    #adminPosts {
      display: grid;
      gap: 16px;
    }

    .admin-post {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 22px;

      padding: 18px;

      border: 1px solid var(--line);
      border-radius: 18px;

      background: var(--surface-2);
    }

    .admin-post img {
      width: 220px;
      height: 150px;

      border-radius: 14px;

      object-fit: cover;

      background: #e7e3dc;
    }

    .admin-post-info {
      min-width: 0;
    }

    .admin-post-info h3 {
      margin: 8px 0 8px;

      font-family: var(--dev);
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .admin-post-meta {
      font: 9px var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;

      color: var(--muted);
    }

    .admin-post-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-post-actions button {
      min-height: 40px;
      padding: 0 14px;

      border: 1px solid var(--line);
      border-radius: 999px;

      background: white;

      font: 9px var(--mono);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .admin-post-actions button:hover {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 900px) {

      .admin-shell {
        width: min(92vw, 700px);
        padding-top: 35px;
      }

      .dash-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .two {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .admin-post {
        grid-template-columns: 1fr;
      }

      .admin-post img {
        width: 100%;
        height: 240px;
      }

      .admin-post-actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 600px) {

      .admin-nav {
        height: 72px;
        padding: 0 5vw;
      }

      .admin-shell {
        width: 92vw;
        padding-bottom: 50px;
      }

      .login-card,
      .editor-card,
      .posts-admin {
        padding: 22px;
        border-radius: 20px;
      }

      .dash-head h1 {
        font-size: 58px;
      }

      .editor-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .editor-top .ghost {
        width: 100%;
      }

      .stats b {
        font-size: 46px;
      }

      .admin-post-info h3 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body class="admin-page">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="admin-nav">

    <a class="admin-brand" href="index.html">
      <span class="admin-brand-mark">आ</span>
      <strong>WAAZ</strong>
    </a>

    <a
      class="website-link"
      href="index.html"
    >
      ← Website
    </a>

  </header>


  <main class="admin-shell">

    <!-- =========================
         LOGIN
    ========================== -->

    <div
      id="login"
      class="login-card"
    >

      <span class="eyebrow">
        PRIVATE AREA
      </span>

      <h1>
        Admin<br>
        Studio
      </h1>

      <p>
        Firebase Email / Password से login करें.
      </p>


      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <input
        id="adminPass"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button
        id="loginBtn"
        class="primary"
        type="button"
      >
        Login
      </button>


      <button
        id="signupBtn"
        class="ghost"
        type="button"
      >
        Create account
      </button>


      <div class="role-note">
        हर नया account default में
        <b>User</b> होगा.
        Admin/Editor role Firestore में
        सुरक्षित तरीके से assign होगा.
      </div>

      <small id="loginMsg"></small>

    </div>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div
      id="dashboard"
      hidden
    >

      <!-- Dashboard Header -->

      <div class="dash-head">

        <div>

          <span class="eyebrow">
            CONTENT STUDIO
          </span>

          <h1>
            Dashboard
          </h1>

          <small id="adminIdentity"></small>

          <span
            id="roleBadge"
            class="role-badge"
          >
            STAFF
          </span>

        </div>


        <button
          id="logout"
          class="ghost"
        >
          Logout
        </button>

      </div>


      <!-- Stats -->

      <div class="stats">

        <div>
          <b id="totalStat">0</b>
          <span>Total Posts</span>
        </div>

        <div>
          <b id="liveStat">0</b>
          <span>Published</span>
        </div>

        <div>
          <b id="draftStat">0</b>
          <span>Drafts</span>
        </div>

      </div>


      <!-- =========================
           NEW POST
      ========================== -->

      <section class="editor-card">

        <div class="editor-top">

          <h2 id="formTitle">
            New Post
          </h2>

          <button
            id="cancelEdit"
            class="ghost"
            hidden
          >
            Cancel edit
          </button>

        </div>


        <form id="postForm">

          <input
            type="hidden"
            id="editId"
          >


          <div class="two">

            <label>
              Title

              <input
                id="title"
                required
                placeholder="पोस्ट का title"
              >
            </label>


            <label>
              Category

              <select id="category">

                <option>कहानी</option>
                <option>खबर</option>
                <option>विचार</option>
                <option>इतिहास</option>
                <option>Technology</option>
                <option>मनोरंजन</option>

              </select>

            </label>

          </div>


          <label>

            Subtitle

            <input
              id="subtitle"
              placeholder="एक छोटी सी line"
            >

          </label>


          <label>

            Cover Image

            <input
              id="imageFile"
              type="file"
              accept="image/*"
            >

            <small>
              Cloudinary पर upload होगा.
              चाहें तो नीचे existing URL भी डाल सकते हैं.
            </small>

          </label>


          <label>

            Image URL

            <input
              id="image"
              placeholder="https://..."
            >

          </label>


          <label>

            Content

            <textarea
              id="content"
              rows="12"
              required
              placeholder="यहाँ पूरा Hindi / English article लिखें..."
            ></textarea>

          </label>


          <div class="two">

            <label>

              Author

              <input
                id="author"
                value="Awaaz Editorial"
              >

            </label>


            <label>

              Status

              <select id="status">

                <option value="published">
                  Published
                </option>

                <option value="draft">
                  Draft
                </option>

              </select>

              <small id="statusHint" hidden></small>

            </label>

          </div>


          <div
            id="uploadStatus"
            class="progress-line"
          ></div>


          <button
            class="primary"
            type="submit"
          >
            Publish / Save Post
          </button>

        </form>

      </section>


      <!-- =========================
           POSTS
      ========================== -->

      <section class="posts-admin">

        <div class="editor-top">

          <h2>
            Your Posts
          </h2>

          <button
            id="refreshBtn"
            class="ghost"
          >
            Refresh
          </button>

        </div>


        <div id="adminPosts"></div>

      </section>

    </div>

  </main>


  <script
    type="module"
    src="admin.js"
  ></script>

</body>
</html>
